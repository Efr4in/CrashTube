<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CrashTube — Panel Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #07090f; --surface: #0d1117; --card: #131b27;
  --border: #1e2d40; --accent: #00c4a7; --accent2: #ff5e57;
  --gold: #f0b429; --text: #e8edf3; --muted: #6b7a8d;
  --font-head: 'Syne', sans-serif; --font-body: 'Outfit', sans-serif;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--surface); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

canvas#bg { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; opacity: 0.5; }

/* NAV */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: 60px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px;
  background: rgba(7,9,15,0.9); backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.nav-brand {
  font-family: var(--font-head); font-weight: 800; font-size: 20px;
  display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text);
}
.nav-brand .dot {
  width: 28px; height: 28px; background: var(--accent);
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
}
.nav-brand .dot svg { width: 16px; height: 16px; fill: #07090f; }
.nav-badge {
  background: rgba(0,196,167,0.1); border: 1px solid rgba(0,196,167,0.3);
  color: var(--accent); font-size: 11px; font-weight: 600;
  padding: 3px 10px; border-radius: 20px; font-family: var(--font-body);
}
.nav-right { display: flex; align-items: center; gap: 14px; }
.nav-user { font-size: 13px; color: var(--muted); }
.nav-user span { color: var(--accent); font-weight: 600; }
.btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-family: var(--font-body); font-size: 13px; font-weight: 500; transition: all .2s; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--accent2); color: var(--accent2); }
.btn-primary { background: var(--accent); color: #07090f; font-weight: 600; }
.btn-primary:hover { background: #00dfc0; }
.btn-danger { background: rgba(255,94,87,0.1); color: var(--accent2); border: 1px solid rgba(255,94,87,0.25); font-size: 12px; padding: 6px 12px; }
.btn-danger:hover { background: rgba(255,94,87,0.2); }

/* MAIN */
.main { position: relative; z-index: 1; margin-top: 60px; padding: 32px 28px; max-width: 1300px; margin-left: auto; margin-right: auto; }

/* STATS ROW */
.stats-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-bottom: 32px; }
.stat-card {
  background: rgba(13,17,23,0.8); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px 24px;
  backdrop-filter: blur(8px);
}
.stat-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
.stat-value { font-family: var(--font-head); font-size: 32px; font-weight: 800; }
.stat-value.teal { color: var(--accent); }
.stat-value.red { color: var(--accent2); }
.stat-value.gold { color: var(--gold); }

/* GRID */
.admin-grid { display: grid; grid-template-columns: 1fr 400px; gap: 24px; align-items: start; }
@media(max-width: 1000px) { .admin-grid { grid-template-columns: 1fr; } }

/* PANEL */
.panel {
  background: rgba(13,17,23,0.8); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; backdrop-filter: blur(8px);
}
.panel-header {
  padding: 18px 24px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.panel-title { font-family: var(--font-head); font-size: 16px; font-weight: 700; }
.panel-body { padding: 20px 24px; }

/* VIDEO LIST */
.video-row {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 0; border-bottom: 1px solid rgba(30,45,64,0.6);
}
.video-row:last-child { border-bottom: none; }
.video-thumb {
  width: 72px; min-width: 72px; aspect-ratio: 16/9;
  border-radius: 6px; overflow: hidden; background: var(--surface);
}
.video-thumb img { width: 100%; height: 100%; object-fit: cover; }
.video-info { flex: 1; min-width: 0; }
.video-info-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
.video-info-meta { font-size: 11px; color: var(--muted); }
.video-info-meta .tag-pill {
  background: rgba(0,196,167,0.1); color: var(--accent);
  border-radius: 4px; padding: 1px 6px; font-size: 10px; font-weight: 500;
}

/* ADD VIDEO FORM */
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.form-input, .form-textarea {
  width: 100%; background: rgba(7,9,15,0.7); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 12px; color: var(--text);
  font-family: var(--font-body); font-size: 13px; outline: none; transition: border-color .2s;
}
.form-input:focus, .form-textarea:focus { border-color: var(--accent); }
.form-textarea { height: 70px; resize: none; }
.form-row { display: flex; gap: 10px; }
.form-row .form-group { flex: 1; }

/* VIEWS TABLE */
.views-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.views-table th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.views-table td { padding: 10px 0; border-bottom: 1px solid rgba(30,45,64,0.5); }
.views-table td:last-child { color: var(--muted); font-size: 12px; }
.empty { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }

/* TOAST */
.toast {
  position: fixed; bottom: 24px; right: 24px; z-index: 300;
  background: var(--card); border: 1px solid var(--accent);
  border-radius: 10px; padding: 12px 20px; font-size: 14px; font-weight: 500;
  color: var(--accent); transform: translateY(80px); opacity: 0;
  transition: all .35s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.error { border-color: var(--accent2); color: var(--accent2); }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<nav>
  <a class="nav-brand" href="/">
    <div class="dot"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    CrashTube
    <span class="nav-badge">Admin</span>
  </a>
  <div class="nav-right">
    <span class="nav-user">Hola, <span id="nav-username">—</span></span>
    <a href="/" class="btn btn-ghost">Ver Sitio</a>
    <button class="btn btn-ghost" onclick="logout()">Cerrar Sesión</button>
  </div>
</nav>

<div class="main">
  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card">
      <p class="stat-label">Total Videos</p>
      <p class="stat-value teal" id="stat-videos">—</p>
    </div>
    <div class="stat-card">
      <p class="stat-label">Reproducciones Hoy</p>
      <p class="stat-value gold" id="stat-views-today">—</p>
    </div>
    <div class="stat-card">
      <p class="stat-label">Total Reproducciones</p>
      <p class="stat-value" id="stat-views-total">—</p>
    </div>
  </div>

  <div class="admin-grid">
    <!-- VIDEO LIST -->
    <div>
      <div class="panel">
        <div class="panel-header">
          <h2 class="panel-title">📽 Catálogo de Videos</h2>
        </div>
        <div class="panel-body">
          <div id="video-list"><p class="empty">Cargando videos...</p></div>
        </div>
      </div>

      <!-- VIEWS -->
      <div class="panel" style="margin-top:20px">
        <div class="panel-header">
          <h2 class="panel-title">👁 Últimas Reproducciones</h2>
        </div>
        <div class="panel-body">
          <div id="views-list"><p class="empty">Cargando...</p></div>
        </div>
      </div>
    </div>

    <!-- ADD VIDEO FORM -->
    <div class="panel" style="position:sticky;top:80px">
      <div class="panel-header">
        <h2 class="panel-title">+ Agregar Video</h2>
      </div>
      <div class="panel-body">
        <div class="form-group">
          <label class="form-label">URL de Google Drive *</label>
          <input class="form-input" id="f-url" type="url" placeholder="https://drive.google.com/file/d/..."/>
        </div>
        <div class="form-group">
          <label class="form-label">Título *</label>
          <input class="form-input" id="f-title" type="text" placeholder="Nombre de la película"/>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Categoría</label>
            <input class="form-input" id="f-cat" type="text" placeholder="Película, Serie..."/>
          </div>
          <div class="form-group">
            <label class="form-label">Año</label>
            <input class="form-input" id="f-year" type="text" placeholder="2024"/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Descripción</label>
          <textarea class="form-textarea" id="f-desc" placeholder="Sinopsis..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Miniatura (URL opcional)</label>
          <input class="form-input" id="f-thumb" type="url" placeholder="https://..."/>
        </div>
        <button class="btn btn-primary" style="width:100%;padding:12px;font-size:14px" onclick="addVideo()">Guardar Video</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ─── 3D CUBE BACKGROUND ─────────────────── */
(function() {
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  let W, H, cubes = [];
  let mouseX = 0, mouseY = 0;
  let camOffX = 0, camOffY = 0;
  const TW = 56, TH = 28;
  const ACCENT = '0, 196, 167';

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    buildGrid();
  }

  function buildGrid() {
    cubes = [];
    const cols = Math.ceil(W / TW) + 8;
    const rows = Math.ceil(H / TH) + 8;
    for (let r = -4; r < rows; r++) {
      for (let c = -4; c < cols; c++) {
        cubes.push({
          c, r,
          h: Math.random() > 0.82 ? Math.floor(Math.random() * 4) + 1 : 0,
          glow: 0, target: 0,
          timer: Math.random() * 500
        });
      }
    }
    cubes.sort((a, b) => (a.c + a.r) - (b.c + b.r));
  }

  function drawCube(c, r, h, glow) {
    const px = (c - r) * TW / 2 + W / 2 + camOffX;
    const py = (c + r) * TH / 2 + H / 4 + camOffY;
    const lift = h * TH;
    const g = glow;
    const bs = 0.1 + g * 0.45;
    const bf = 0.02 + g * 0.15;

    ctx.beginPath();
    ctx.moveTo(px, py - lift - TH);
    ctx.lineTo(px + TW/2, py - lift - TH/2);
    ctx.lineTo(px, py - lift);
    ctx.lineTo(px - TW/2, py - lift - TH/2);
    ctx.closePath();
    ctx.fillStyle = `rgba(${ACCENT}, ${bf * 1.4})`;
    ctx.fill();
    ctx.strokeStyle = `rgba(${ACCENT}, ${bs})`;
    ctx.lineWidth = 0.7; ctx.stroke();

    if (h > 0) {
      ctx.beginPath();
      ctx.moveTo(px + TW/2, py - lift - TH/2);
      ctx.lineTo(px + TW/2, py - TH/2);
      ctx.lineTo(px, py); ctx.lineTo(px, py - lift);
      ctx.closePath();
      ctx.fillStyle = `rgba(${ACCENT}, ${bf * 0.8})`; ctx.fill();
      ctx.strokeStyle = `rgba(${ACCENT}, ${bs * 0.8})`; ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(px - TW/2, py - lift - TH/2);
      ctx.lineTo(px - TW/2, py - TH/2);
      ctx.lineTo(px, py); ctx.lineTo(px, py - lift);
      ctx.closePath();
      ctx.fillStyle = `rgba(${ACCENT}, ${bf * 0.5})`; ctx.fill();
      ctx.strokeStyle = `rgba(${ACCENT}, ${bs * 0.6})`; ctx.stroke();
    }

    if (g > 0.2) {
      ctx.save();
      ctx.shadowColor = `rgb(${ACCENT})`; ctx.shadowBlur = 18 * g;
      ctx.beginPath();
      ctx.moveTo(px, py - lift - TH);
      ctx.lineTo(px + TW/2, py - lift - TH/2);
      ctx.lineTo(px, py - lift);
      ctx.lineTo(px - TW/2, py - lift - TH/2);
      ctx.closePath();
      ctx.fillStyle = `rgba(${ACCENT}, ${g * 0.22})`; ctx.fill();
      ctx.restore();
    }
  }

  function animate() {
    ctx.clearRect(0, 0, W, H);
    camOffX += ((mouseX - W/2) * 0.015 - camOffX) * 0.04;
    camOffY += ((mouseY - H/2) * 0.01 - camOffY) * 0.04;
    cubes.forEach(cube => {
      cube.timer--;
      if (cube.timer <= 0) {
        cube.target = Math.random() > 0.72 ? Math.random() * 0.85 + 0.15 : 0;
        cube.timer = 80 + Math.random() * 500;
      }
      cube.glow += (cube.target - cube.glow) * 0.035;
      drawCube(cube.c, cube.r, cube.h, cube.glow);
    });
    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
  resize(); animate();
})();

/* ─── AUTH CHECK ─────────────────────────── */
const token = localStorage.getItem('ct_token');
const username = localStorage.getItem('ct_user');
if (!token) window.location.href = '/login';
document.getElementById('nav-username').textContent = username || '—';

function getHeaders() {
  return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
}

function logout() {
  localStorage.removeItem('ct_token');
  localStorage.removeItem('ct_user');
  window.location.href = '/login';
}

/* ─── DRIVE UTILS ────────────────────────── */
function parseDriveId(url) {
  const m = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
  if (m) return m[1];
  const m2 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  return m2 ? m2[1] : null;
}

/* ─── LOAD DATA ──────────────────────────── */
let allVideos = [];
let allViews = [];

async function loadAll() {
  await Promise.all([loadVideos(), loadViews()]);
  updateStats();
}

async function loadVideos() {
  const res = await fetch('/api/videos');
  allVideos = await res.json();
  renderVideos();
}

async function loadViews() {
  try {
    const res = await fetch('/api/views', { headers: getHeaders() });
    allViews = await res.json();
    renderViews();
  } catch(e) { allViews = []; }
}

function updateStats() {
  document.getElementById('stat-videos').textContent = allVideos.length;
  document.getElementById('stat-views-total').textContent = allViews.length;
  const today = new Date().toDateString();
  const todayViews = allViews.filter(v => new Date(v.viewed_at).toDateString() === today);
  document.getElementById('stat-views-today').textContent = todayViews.length;
}

function renderVideos() {
  const list = document.getElementById('video-list');
  if (!allVideos.length) {
    list.innerHTML = '<p class="empty">Sin videos aún. ¡Agregá uno!</p>';
    return;
  }
  list.innerHTML = allVideos.map(v => {
    const fid = parseDriveId(v.drive_url);
    const thumb = v.thumb_url || (fid ? `https://drive.google.com/thumbnail?id=${fid}&sz=w200` : '');
    return `
    <div class="video-row" id="vrow-${v.id}">
      <div class="video-thumb">
        ${thumb ? `<img src="${esc(thumb)}" onerror="this.style.display='none'"/>` : ''}
      </div>
      <div class="video-info">
        <p class="video-info-title">${esc(v.title)}</p>
        <p class="video-info-meta">
          ${v.category ? `<span class="tag-pill">${esc(v.category)}</span> ` : ''}
          ${v.year ? esc(v.year) : ''}
        </p>
      </div>
      <button class="btn btn-danger" onclick="deleteVideo(${v.id})">Eliminar</button>
    </div>`;
  }).join('');
}

function renderViews() {
  const list = document.getElementById('views-list');
  if (!allViews.length) {
    list.innerHTML = '<p class="empty">Sin reproducciones aún.</p>';
    return;
  }
  list.innerHTML = `
  <table class="views-table">
    <thead><tr><th>Video</th><th>IP</th><th>Fecha</th></tr></thead>
    <tbody>
      ${allViews.slice(0, 20).map(v => `
      <tr>
        <td>${esc(v.videos?.title || '—')}</td>
        <td>${esc(v.ip || '—')}</td>
        <td>${new Date(v.viewed_at).toLocaleString('es')}</td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

/* ─── ADD VIDEO ──────────────────────────── */
async function addVideo() {
  const drive_url = document.getElementById('f-url').value.trim();
  const title = document.getElementById('f-title').value.trim();
  const category = document.getElementById('f-cat').value.trim();
  const year = document.getElementById('f-year').value.trim();
  const description = document.getElementById('f-desc').value.trim();
  const thumb_url = document.getElementById('f-thumb').value.trim();

  if (!drive_url || !title) { showToast('URL y Título son obligatorios', true); return; }
  if (!parseDriveId(drive_url)) { showToast('URL de Drive inválida', true); return; }

  const res = await fetch('/api/videos', {
    method: 'POST',
    headers: getHeaders(),
    body: JSON.stringify({ title, drive_url, category, year, description, thumb_url })
  });
  const data = await res.json();

  if (!res.ok) { showToast(data.error || 'Error al guardar', true); return; }

  ['f-url','f-title','f-cat','f-year','f-desc','f-thumb'].forEach(id => document.getElementById(id).value = '');
  showToast(`"${title}" agregado ✓`);
  await loadAll();
}

/* ─── DELETE VIDEO ───────────────────────── */
async function deleteVideo(id) {
  if (!confirm('¿Eliminar este video del catálogo?')) return;
  const res = await fetch(`/api/videos?id=${id}`, { method: 'DELETE', headers: getHeaders() });
  if (!res.ok) { showToast('Error al eliminar', true); return; }
  showToast('Video eliminado');
  await loadAll();
}

/* ─── TOAST ──────────────────────────────── */
function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3000);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ─── INIT ───────────────────────────────── */
loadAll();
setInterval(loadAll, 30000); // refresh every 30s
</script>
</body>
</html>
