<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CrashTube — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#07090f;--surface:#0d1117;--card:#111827;--border:#1e2d40;--accent:#00c4a7;--accent2:#ff5e57;--text:#e8edf3;--muted:#6b7a8d;--font-head:'Exo 2',sans-serif;--font-body:'Outfit',sans-serif;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;}
canvas{position:fixed;inset:0;z-index:0;width:100%;height:100%;pointer-events:none;}

.login-wrap{position:relative;z-index:10;width:100%;max-width:420px;padding:20px;}
.login-box{
  background:rgba(13,17,23,0.88);border:1px solid rgba(0,196,167,0.15);
  border-radius:20px;padding:44px 40px;
  backdrop-filter:blur(20px);
  box-shadow:0 32px 64px rgba(0,0,0,0.6),0 0 60px rgba(0,196,167,0.04);
}
.brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:32px;}
.brand-dot{width:34px;height:34px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(0,196,167,0.4);}
.brand-dot svg{width:18px;height:18px;fill:#07090f;}
.brand-name{font-family:var(--font-head);font-size:24px;font-weight:800;}
.login-title{font-family:var(--font-head);font-size:20px;font-weight:700;text-align:center;margin-bottom:6px;}
.login-sub{color:var(--muted);font-size:13px;text-align:center;margin-bottom:28px;}
.form-group{margin-bottom:18px;}
.form-label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px;}
.form-input{width:100%;background:rgba(7,9,15,0.7);border:1px solid var(--border);border-radius:10px;padding:13px 15px;color:var(--text);font-family:var(--font-body);font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s;}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,196,167,0.1);}
.btn-login{width:100%;padding:13px;background:var(--accent);color:#07090f;font-family:var(--font-head);font-size:15px;font-weight:700;border:none;border-radius:10px;cursor:pointer;transition:all .2s;margin-top:6px;}
.btn-login:hover{background:#00dfc0;transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,196,167,0.3);}
.btn-login:disabled{opacity:0.6;transform:none;cursor:not-allowed;}
.error-msg{background:rgba(255,94,87,0.08);border:1px solid rgba(255,94,87,0.3);border-radius:8px;padding:11px;color:var(--accent2);font-size:12px;margin-top:14px;text-align:center;display:none;}
.back-link{text-align:center;margin-top:20px;font-size:12px;color:var(--muted);}
.back-link a{color:var(--accent);text-decoration:none;}
.back-link a:hover{text-decoration:underline;}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div class="login-wrap">
  <div class="login-box">
    <div class="brand">
      <div class="brand-dot"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
      <span class="brand-name">CrashTube</span>
    </div>
    <h1 class="login-title">Acceso Admin</h1>
    <p class="login-sub">Solo personal autorizado</p>
    <div class="form-group">
      <label class="form-label">Usuario</label>
      <input class="form-input" id="username" type="text" placeholder="tu usuario" autocomplete="username"/>
    </div>
    <div class="form-group">
      <label class="form-label">Contraseña</label>
      <input class="form-input" id="password" type="password" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button class="btn-login" id="btn-login" onclick="doLogin()">Iniciar Sesión</button>
    <div class="error-msg" id="error-msg"></div>
    <div class="back-link"><a href="/">← Volver al inicio</a></div>
  </div>
</div>

<script>
// ── Starfield + aurora (mismo que main) ────────────────────────────────────────
(function(){
  const C=document.getElementById('bg'),ctx=C.getContext('2d');
  let W,H,mx=window.innerWidth/2,my=window.innerHeight/2,offX=0,offY=0;
  const LAYERS=[{count:180,sz:.8,sp:.018,op:.35,stars:[]},{count:80,sz:1.5,sp:.04,op:.55,stars:[]},{count:30,sz:2.5,sp:.07,op:.8,stars:[]}];
  let shoots=[];
  function resize(){
    W=C.width=window.innerWidth;H=C.height=window.innerHeight;
    LAYERS.forEach(l=>{l.stars=Array.from({length:l.count},()=>({x:Math.random()*W,y:Math.random()*H,r:l.sz*(.5+Math.random()),tw:Math.random()*Math.PI*2,ts:.02+Math.random()*.03}));});
  }
  let t=0;
  function draw(){
    t++;ctx.clearRect(0,0,W,H);
    offX+=((mx-W/2)*.04-offX)*.05;offY+=((my-H/2)*.025-offY)*.05;
    // Aurora
    for(let i=0;i<3;i++){
      const y=H*(.65+i*.12),g=ctx.createLinearGradient(0,y-80,0,y+60),h2=(180+i*30+Math.sin(t*.0003)*20);
      g.addColorStop(0,`hsla(${h2},70%,50%,0)`);g.addColorStop(.5,`hsla(${h2},70%,50%,${.04-i*.01})`);g.addColorStop(1,`hsla(${h2},70%,50%,0)`);
      ctx.beginPath();ctx.moveTo(0,y);for(let x=0;x<=W;x+=40)ctx.lineTo(x,y+Math.sin(x*.008+t*.0006+i)*28);
      ctx.lineTo(W,y+80);ctx.lineTo(0,y+80);ctx.closePath();ctx.fillStyle=g;ctx.fill();
    }
    // Shooting stars
    if(Math.random()<.003)shoots.push({x:Math.random()*W*.7,y:Math.random()*H*.4,len:80+Math.random()*120,spd:8+Math.random()*6,alpha:1,angle:Math.PI/4+(Math.random()-.5)*.3});
    shoots=shoots.filter(s=>s.alpha>.05);
    shoots.forEach(s=>{
      ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.angle);
      const g=ctx.createLinearGradient(0,0,s.len,0);g.addColorStop(0,`rgba(200,230,255,${s.alpha})`);g.addColorStop(1,'rgba(200,230,255,0)');
      ctx.strokeStyle=g;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(s.len,0);ctx.stroke();ctx.restore();
      s.x+=Math.cos(s.angle)*s.spd;s.y+=Math.sin(s.angle)*s.spd;s.alpha*=.97;
    });
    // Stars
    LAYERS.forEach(l=>l.stars.forEach(s=>{
      s.tw+=s.ts;const a=l.op*(.5+.5*Math.sin(s.tw));
      const px=((s.x+offX*l.sp)%W+W)%W,py=((s.y+offY*l.sp)%H+H)%H;
      ctx.beginPath();ctx.arc(px,py,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(220,235,255,${a})`;ctx.fill();
      if(l.sz>2&&a>.6){ctx.beginPath();ctx.arc(px,py,s.r*3,0,Math.PI*2);ctx.fillStyle=`rgba(0,196,167,${a*.1})`;ctx.fill();}
    }));
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',resize);
  window.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
  resize();draw();
})();

// ── Login ──────────────────────────────────────────────────────────────────────
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('username').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

async function doLogin(){
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value;
  const btn=document.getElementById('btn-login');
  const err=document.getElementById('error-msg');
  if(!username||!password){showError('Completá usuario y contraseña.');return;}
  btn.textContent='Verificando...';btn.disabled=true;err.style.display='none';
  try{
    const res=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const data=await res.json();
    if(!res.ok){showError(data.error||'Error al iniciar sesión');btn.textContent='Iniciar Sesión';btn.disabled=false;return;}
    localStorage.setItem('ct_token',data.token);
    localStorage.setItem('ct_user',data.username);
    window.location.href='/admin';
  }catch(e){
    showError('Error de conexión. Intentá de nuevo.');
    btn.textContent='Iniciar Sesión';btn.disabled=false;
  }
}
function showError(msg){const e=document.getElementById('error-msg');e.textContent=msg;e.style.display='block';}
</script>
</body>
</html>
